name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Las dos puntas del rango que promete el README: 3.10 minimo, 3.12 actual.
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - run: pip install -r requirements.txt

      # test_no_secrets.py usa `git ls-files`, por eso corre sobre el checkout.
      - name: No hay credenciales en ficheros versionados
        run: python test_no_secrets.py

      - name: La tabla de tareas se ve bien en cualquier ancho
        run: python test_tabla_tareas.py

      - name: No hay except desnudos
        run: python test_no_bare_except.py
